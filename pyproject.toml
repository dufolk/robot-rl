[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-rl"
version = "0.1.0"
description = "Bipedal humanoid platform on MuJoCo, with an RL interface."
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.3",
    "numpy>=1.26",
    "gymnasium>=0.29",
]

[project.scripts]
robot-rl = "robot_rl.play:main"

[tool.setuptools.packages.find]
include = ["robot_rl*"]
